[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests — pure logic, no I/O
    integration: Integration tests — real dependencies (DB, LocalStack)
    api: API endpoint tests — HTTP request/response validation
    e2e: End-to-end tests — cross-module workflows

filterwarnings =
    ignore::DeprecationWarning

addopts =
    -v
    --tb=short
    --strict-markers
